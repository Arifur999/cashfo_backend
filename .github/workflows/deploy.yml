name: Deploy

# main -> CI must pass -> ghcr.io/arifur999/cashfo_backend. The VPS does the
# rest: deploy/agent/smartly-deploy.sh notices the new image within two
# minutes and rolls back if the release never turns healthy.
#
# There is no SSH step. GitHub's runners cannot reach the server on port 22,
# so the release is pulled rather than pushed, and no SSH key lives in this
# repo. A red quality gate publishes nothing, so the live site stays on the
# last good release. The whole setup: deploy/README.md.
on:
  push:
    branches: [main]
    # Docs and the server-side scripts can't change the image. Publishing
    # anyway would still produce a new digest, and every new digest restarts
    # the live container.
    paths-ignore:
      - "**/*.md"
      - "deploy/**"
  workflow_dispatch:

# Nothing here needs more than to read the code; the publish job asks for
# packages: write itself.
permissions:
  contents: read

concurrency:
  # Queue releases rather than cancel them: a cancelled push step could leave
  # :latest pointing at an older build than the one that was tested last.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    with:
      skip-image-build: true

  publish:
    name: Publish cashfo_backend
    needs: quality
    # "Run workflow" can be started on any branch; only main may become
    # :latest, which the server releases within two minutes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arifur999/cashfo_backend:${{ github.sha }}
            ghcr.io/arifur999/cashfo_backend:latest
          # com.softech.project lets the VPS prune only smartly's old images.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.softech.project=smartly
          cache-from: type=gha
          cache-to: type=gha,mode=max
