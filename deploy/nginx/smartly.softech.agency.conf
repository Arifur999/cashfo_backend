# smartly.softech.agency -- Cashfo. Mounted into the server's shared nginx
# container (hatim_backend-nginx-1) from /opt/smartly/nginx/. Only
# smartly-web is reachable from here; the API and database are not on this
# network.

server {
    listen 80;
    server_name smartly.softech.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name smartly.softech.agency;

    ssl_certificate     /etc/letsencrypt/live/smartly.softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartly.softech.agency/privkey.pem;

    # Look smartly-web up per request through Docker's DNS, so this file can
    # never stop nginx -- and every other site on it -- from starting while
    # smartly is down or being redeployed.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $smartly_web http://smartly-web:3000;

    client_max_body_size 10m;

    location / {
        proxy_pass $smartly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
