# smartly.softech.agency -- step one only. Answers Let's Encrypt's HTTP
# challenge so the certificate can be issued; replaced by
# smartly.softech.agency.conf as soon as it exists (see ../README.md).
server {
    listen 80;
    server_name smartly.softech.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
